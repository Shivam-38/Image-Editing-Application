<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <title>IMAGE EDITING APPLICATION</title>
</head>
<body>
    <header class="C1">
        <h1>EDIT YOUR IMAGE</h1>
        <div class="header-buttons">
          
             <label for="insertimg" class="New">
    <i class="fa-solid fa-file"> </i> New
</label>
<input type="file" id="insertimg" accept="image/*" hidden>
            <button><i class="fa-regular fa-folder-open"></i> Open</button>
            <button><i class="fa-regular fa-floppy-disk"></i> Save</button>
            <button><i class="fa-solid fa-cloud-arrow-down"></i> Download</button>
        </div>
    </header>
   <main>
    <div class="workspace">
   <div class="C2">
    <div class="card">
    <p ><i class="fa-solid fa-hammer"></i>TOOLS</p>
    
    <button><i class="fa-solid fa-crop"></i>CROP</button>
    <button><i class="fa-solid fa-rotate"></i>Rotate</button>
    <button><i class="fa-solid fa-arrows-alt"></i>Resize</button>
    
    </div>
    <div class="card">
    <p ><i class="fa-solid fa-filter"></i>FILTERS</p>
    <button>Original</button>
    <button>Grayscale</button>
    <button>Blur</button>
    <button>Sharpen</button>
    <button>Edge</button>
    </div>
    <div class="card">
    <p ><i class="fa-solid fa-gear"></i> SETTINGS</p>
    <button id="darkModeToggle" ><i class="fa-solid fa-moon"></i> Dark Mode!</button>
    <button><i class="fa-solid fa-info-circle"></i> About</button>
    </div>
   </div>
   <div class="canvas-container" style="position: relative;">
    <canvas></canvas>
    <div class="canvas-placeholder">
        <span>Drop or upload an image</span>
    </div>
   </div>
   </div>
</main>
<footer>
    <div class="C3">
        <div class="intro">
            <h2>EDOS</h2>
            <p>Simple tools for smarter image processing</p>
            <p>Build for creators: Powered by OpenCV</p>
        </div>
        <div class="links">
            <a href="https://github.com/Shivam-38" target="_blank">
                <i class="fa-brands fa-github"></i> Github
            </a>
            <p><i class="fa-solid fa-info"></i> About</p>
            <p><i class="fa-solid fa-circle-info"></i> Help</p>
        </div>

        <div class="last"><p><i class="fa-regular fa-copyright"></i> 2026 EDOS.com 
        </p>
        <p>Made with <i class="fa-solid fa-heart"></i> for image enthusiasts</p>
        
        </div>
        


    </div>
</footer>

    
    <script src="index.js"></script>
</body>
</html>
